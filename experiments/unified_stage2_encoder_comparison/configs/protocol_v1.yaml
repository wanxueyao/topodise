protocol_version: core-v1.3-portable

dataset_json: datasets/pd_dataset_en/patients_dataset_en.json
dataset_root: datasets
output_root: results/unified_stage2_encoder_comparison

tasks:
  - pd_binary
  - pd_stage
  - pd_subtype_tdrest

encoders:
  topodise_stage1:
    checkpoint: results/unified_stage2_encoder_comparison/pretrained/topodise/stage1_rscp/ckpt/ema_best.pt
    use_ema: true
    auto_pretrain_if_missing: true
    pretrain:
      stage0:
        corn1_root: datasets/CORN-1
        output_dir: results/unified_stage2_encoder_comparison/pretrained/topodise
        run_name: stage0_corn1
        image_size: 224
        epochs: 200
        batch_size: 16
        lr: 0.0001
        weight_decay: 0.01
        z_dim: 512
        T: 1000
        schedule: cosine
        lambda_simple: 1.0
        lambda_topo: 0.1
        topo_target: hgrad
        z_dropout: 0.1
        use_view_contrastive: false
        num_workers: 4
        persistent_workers: false
        prefetch_factor: 2
        pin_memory: null
        non_blocking_transfers: false
        expected_samples: 1516
        amp: false
        channels_last: false
        fused_adamw: false
        resume: true
        reproducibility: true
      stage1:
        pd_json: datasets/pd_dataset_en/patients_dataset_en.json
        region_pair_manifest: null
        base_path: datasets
        output_dir: results/unified_stage2_encoder_comparison/pretrained/topodise
        run_name: stage1_rscp
        epochs: 80
        batch_size: 16
        lr: 0.00002
        weight_decay: 0.01
        lambda_region: 0.5
        lambda_topo: 0.05
        tau_region: 0.2
        topo_target: hgrad
        parent_encoder_weights: raw
        train_denoiser: false
        allow_dm_disease: false
        num_workers: 4
        persistent_workers: false
        prefetch_factor: 2
        pin_memory: null
        non_blocking_transfers: false
        expected_region_pairs: 182
        amp: false
        channels_last: false
        fused_adamw: false
        resume: true
        reproducibility: true
  simclr_resnet18:
    checkpoint: results/unified_stage2_encoder_comparison/pretrained/simclr_resnet18.pt
    auto_pretrain_if_missing: true
    pretrain:
      initialization: false
      batch_size: 32
      lr: 0.001
      temperature: 0.5
      proj_hidden_dim: 256
      proj_out_dim: 128
      weight_decay: 0.0001
      num_workers: 4
      amp: true
      channels_last: true
      persistent_workers: true
      pin_memory: false
      fused_adamw: true
      drop_last: true
      seed: 20260831
      stages:
        - name: stage_a_corn1
          source: corn1_raw
          source_root: datasets/CORN-1
          epochs: 200
          lr: 0.001
        - name: stage_b_regions
          source: region_manifest
          manifest: datasets/unlabeled_dataset_en/unlabeled_dataset_en.json
          dataset_root: datasets
          epochs: 80
          lr: 0.0002
  dinov2_vits14:
    # Local-only official/timm-compatible DINOv2-S/14 checkpoint.
    checkpoint: experiments/unified_stage2_encoder_comparison/pretrained/dinov2_vits14_pretrain.pth
    model_name: vit_small_patch14_dinov2

splits:
  outer_folds: 5
  seeds: [42, 202, 3407]
  inner_val_ratio: 0.2

pairing:
  mode: cartesian
  cap: 8
  seed: 20260831

model:
  common_dim: 512
  adapter_rank: 32
  attention_hidden: 128
  attention_dropout: 0.25
  morphology_dim: 32

optimization:
  epochs: 50
  warmup_epochs: 3
  lr: 0.0005
  min_lr: 0.000001
  weight_decay: 0.01
  grad_clip: 1.0
  accumulate_patients: 8
  patient_batch_size: 8
  eval_patient_batch_size: 64
  fused_adamw: true

runtime:
  device: auto
  amp: true
  num_workers: 4
  feature_batch_size: 64
  pin_memory: false
  channels_last: true
